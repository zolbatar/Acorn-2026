[package]
name = "acorn-2026"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Hosted Acorn-2026 MOS and BASIC64 prototype"
license = "MIT"

[features]
default = []
experimental-jit = [
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-jit",
    "dep:cranelift-module",
    "dep:cranelift-native",
]

[dependencies]
arboard = { version = "3.6.1", default-features = false }
cranelift-codegen = { version = "=0.136.1", optional = true }
cranelift-frontend = { version = "=0.136.1", optional = true }
cranelift-jit = { version = "=0.136.1", optional = true }
cranelift-module = { version = "=0.136.1", optional = true }
cranelift-native = { version = "=0.136.1", optional = true }
pixels = "0.17.2"
winit = { version = "0.30.13", features = ["rwh_06"] }
