    compatibility: "Hosted extension, not a historical RISC OS SWI. Cursor order is deterministic by SWI number. It reports only currently active SWI exports/current generations, not private PROC/FN exports or historical generations. Active module/SWI identity is explicitly public metadata and the query is read-only."

