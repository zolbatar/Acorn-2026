schema_version: 1
inventory_version: 1
scope:
  source: src/swi.rs and src/wimp.rs
  note: >-
    This describes the hosted dispatcher currently in the repository, including
    named-only project services. It is an implementation inventory, not a
    claim of complete RISC OS coverage. Register and memory descriptions use
    the currently implemented hosted contract; public compatibility gaps are
    recorded in trellis-compatibility-matrix.md.

dispatch_routes:
  module_owned:
    - "0x00 OS_WriteC -> Console.WriteC"
    - "0x01 OS_WriteS -> Console.WriteS"
    - "0x02 OS_Write0 -> Console.Write0"
    - "0x03 OS_NewLine -> Console.NewLine"
    - "0x04 OS_ReadC -> Console.ReadC"
    - "0x0E OS_ReadLine -> Console.ReadLine"
  transitional_numeric: all other numeric services below
  transitional_named_only:
    - COLOURTRANS_CONVERTHSVTORGB
    - COLOURTRANS_SETGCOL
    - COLOURTRANS_WRITEPALETTE
    - ACORN_DESKTOP
    - ACORN_DISPLAY

numeric_services:
  - number: "0x00"
    name: OS_WriteC
    current_handler: SwiDispatcher::dispatch (transitional fallback); module route takes precedence
    contract: "R0 low byte input; other registers, PC, and carry preserved"
    logical_memory: none
    blocking: false
    owner: Console
    final_form: "BASIC64 definition with ConsoleStream and ConsoleOutput primitive imports"
    current_tests: "WP3 console module end-to-end test; existing Wimp/graphics output tests"

  - number: "0x01"
    name: OS_WriteS
    current_handler: SwiDispatcher::write_inline_string (transitional fallback)
    contract: "PC points at inline NUL-terminated bytes; PC advances to next word-aligned instruction"
    logical_memory: "read from caller task at PC, at most 4096 bytes"
    blocking: false
    owner: Console
    final_form: "BASIC64 definition using typed caller-scoped PC/address traversal and byte output primitives"
    current_tests: "WP3 module test checks PC alignment; 4096-byte missing-terminator test verifies the original PC error address"

  - number: "0x02"
    name: OS_Write0
    current_handler: SwiDispatcher::write_indirect_string (transitional fallback)
    contract: "R0 logical address input; R0 returns first address after NUL"
    logical_memory: "read caller task at R0, at most 4096 bytes"
    blocking: false
    owner: Console
    final_form: "BASIC64 definition using ADDRESS32-typed caller memory and byte output primitives"
    current_tests: "WP3 module test checks returned R0; 4096-byte missing-terminator test verifies the original R0 address"

  - number: "0x03"
    name: OS_NewLine
    current_handler: SwiDispatcher::dispatch (transitional fallback)
    contract: "emits LF then CR through OS_WriteC; registers, PC, and carry preserved"
    logical_memory: none
    blocking: false
    owner: Console
    final_form: "BASIC64 definition composing the Console byte definition"
    current_tests: "WP3 module end-to-end test"

  - number: "0x04"
    name: OS_ReadC
    current_handler: SwiDispatcher::read_character (transitional fallback)
    contract: "R0 receives byte; carry is set for Escape; EndOfInput is a runtime error"
    logical_memory: none
    blocking: true
    owner: Console
    final_form: "BASIC64 definition over ConsoleInput primitive"
    current_tests: "WP3 module test checks byte and Escape carry; tests/mos_calls.rs checks input bridge"

  - number: "0x05"
    name: OS_CLI
    current_handler: SwiDispatcher::execute_cli
    contract: "R0 logical address of NUL-terminated command; command runs synchronously"
    logical_memory: "read caller task at R0, bounded to MAX_CLI_BYTES"
    blocking: true
    owner: MOS
    final_form: "BASIC64 MOS policy with a command-execution primitive"
    current_tests: "src/swi.rs CLI abbreviation/configuration/desktop tests; tests/mos_calls.rs"

  - number: "0x06"
    name: OS_Byte
    current_handler: SwiDispatcher::os_byte via MosState
    contract: "R0 low byte reason; R1/R2 inputs and reason-specific return registers/carry"
    logical_memory: none
    blocking: false
    owner: MOS
    final_form: "BASIC64 MOS policy over typed input, configuration, and clock primitives"
    current_tests: "tests/mos_calls.rs: osbyte_keyboard_queue_and_cli_use_existing_services; input/register preservation tests"

  - number: "0x07"
    name: OS_Word
    current_handler: SwiDispatcher::os_word and MosState
    contract: "R0 reason; R1 caller logical pointer to reason-specific control block"
    logical_memory: "checked caller memory; reason-specific size (clock reasons 1-4 are tested)"
    blocking: false
    owner: MOS
    final_form: "BASIC64 reason dispatch over typed caller-memory and clock primitives"
    current_tests: "tests/mos_calls.rs: call_osword_uses_checked_full_and_split_pointers"

  - number: "0x08"
    name: OS_File
    current_handler: SwiDispatcher::os_file
    contract: "R0 action; R1 filename pointer; R2-R5 action-specific input/output registers"
    logical_memory: "checked caller strings and action-specific control data"
    blocking: false
    owner: FileSwitch
    final_form: "BASIC64 FileSwitch semantics over filesystem and caller-memory primitives"
    current_tests: "src/swi.rs FileSwitch/guest catalogue tests; compatibility gaps are listed in the matrix"

  - number: "0x09"
    name: OS_Args
    current_handler: SwiDispatcher::os_args
    contract: "R0 reason; R1 open-file handle; R2/R3 reason-specific position/value"
    logical_memory: "no block pointer in the currently hosted reasons"
    blocking: false
    owner: FileSwitch
    final_form: "BASIC64 FileSwitch operation over task-owned file-channel primitives"
    current_tests: "FileSwitch unit coverage is partial; see trellis-compatibility-matrix.md"

  - number: "0x0A"
    name: OS_BGet
    current_handler: SwiDispatcher::os_bget
    contract: "R0 file handle input; R0 byte result; carry reports EOF"
    logical_memory: none
    blocking: false
    owner: FileSwitch
    final_form: "BASIC64 byte-read service over a checked task file-channel primitive"
    current_tests: "src/swi.rs guest catalogue/type tests; focused EOF/handle matrix remains incomplete"

  - number: "0x0B"
    name: OS_BPut
    current_handler: SwiDispatcher::os_bput
    contract: "R0 file handle; R1 byte input"
    logical_memory: none
    blocking: false
    owner: FileSwitch
    final_form: "BASIC64 byte-write service over a checked task file-channel primitive"
    current_tests: "FileSwitch unit coverage is partial; see trellis-compatibility-matrix.md"

  - number: "0x0C"
    name: OS_GBPB
    current_handler: SwiDispatcher::os_gbpb / os_gbpb_file / os_gbpb_names
    contract: "R0 reason; R1 handle; R2 caller buffer; R3 count; R4/R5 operation-specific state"
    logical_memory: "checked caller buffer for byte and catalogue operations"
    blocking: false
    owner: FileSwitch
    final_form: "BASIC64 reason handling over checked memory and file-channel primitives"
    current_tests: "src/swi.rs catalogue and guest-buffer tests; full reason set not implemented"

  - number: "0x0D"
    name: OS_Find
    current_handler: SwiDispatcher::os_find
    contract: "R0 open/close action; R1 filename pointer or handle; R0 returns allocated handle"
    logical_memory: "checked caller NUL-terminated filename"
    blocking: false
    owner: FileSwitch
    final_form: "BASIC64 channel lifecycle over filesystem primitives"
    current_tests: "src/swi.rs guest catalogue tests; exact historical flag combinations remain incomplete"

  - number: "0x0E"
    name: OS_ReadLine
    current_handler: "Console.ReadLine via module entry cell; SwiDispatcher::read_line remains an explicit transitional fallback"
    contract: "R0 buffer/options; R1 maximum length; R2/R3 accepted byte range; R4 optional echo byte; returns R0=0, R1=length, R2=R3=0 and carry on Escape"
    logical_memory: "checked caller buffer, at most requested length"
    blocking: true
    owner: Console
    final_form: "BASIC64 edit/echo policy over ConsoleInput, ConsoleOutput, and checked caller-scoped memory"
    current_tests: "swi::tests::os_read_line_* cover module route, editing/backspace, accepted range, echo-only and R4 substitution flags, buffer-full bell, Escape, EOF, CR and memory bounds; exhaustive option combinations and exact error-block details remain gaps"

  - number: "0x29"
    name: OS_FSControl
    current_handler: SwiDispatcher::os_fscontrol
    contract: "R0 reason; R1 filesystem number or string pointer; R2-R5 reason-specific data"
    logical_memory: "checked caller strings and reason-specific control data"
    blocking: false
    owner: FileSwitch
    final_form: "BASIC64 filing-system policy over host volume and checked memory primitives"
    current_tests: "src/swi.rs guest catalogue/type tests; filing-system reason coverage is partial"

  - number: "0x32"
    name: OS_ReadPoint
    current_handler: SwiDispatcher::dispatch
    contract: "R0/R1 input coordinates; R2/R3 result colour/tint; R4 indicates outside-surface result"
    logical_memory: none
    blocking: false
    owner: Graphics
    final_form: "BASIC64 graphics service over caller-owned surface query primitive"
    current_tests: "src/swi.rs os_read_point_reads_immediate_pixels_and_preserves_coordinates"

  - number: "0x45"
    name: OS_Plot
    current_handler: SwiDispatcher::dispatch
    contract: "R0 plot code; R1/R2 signed logical coordinates"
    logical_memory: none
    blocking: false
    owner: Graphics
    final_form: "BASIC64 plot policy over protected graphics submission primitive"
    current_tests: "src/swi.rs Wimp redraw/graphics routing tests; no complete plot-code conformance suite"

  - number: "0x400C0"
    name: Wimp_Initialise
    current_handler: SwiDispatcher::dispatch_wimp -> WimpServer::initialise
    contract: "R0 requested version in/result version; R1 'TASK' magic in/task handle out; R2 description pointer; R3 optional terminated message-list pointer"
    logical_memory: "checked caller strings and optional word list"
    blocking: false
    owner: Wimp
    final_form: "BASIC64 Wimp validation and task registration over task/window primitives"
    current_tests: "src/wimp.rs initialization tests; tests/wimp_desktop.rs multi-task tests"

  - number: "0x400C1"
    name: Wimp_CreateWindow
    current_handler: WimpServer::create_window
    contract: "R1 pointer to 88-byte window definition; R0 returns window handle"
    logical_memory: "checked caller window definition and referenced title"
    blocking: false
    owner: Wimp
    final_form: "BASIC64 validation/layout policy over protected window creation primitive"
    current_tests: "src/swi.rs Wimp helpers; tests/wimp_desktop.rs window lifecycle/layout tests"

  - number: "0x400C2"
    name: Wimp_CreateIcon
    current_handler: WimpServer::create_icon
    contract: "R0 window handle; R1 caller pointer to icon definition; R0 returns icon handle/index"
    logical_memory: "checked caller icon definition and text"
    blocking: false
    owner: Wimp
    final_form: "BASIC64 icon policy over protected window/icon primitives"
    current_tests: "src/wimp.rs and tests/wimp_desktop.rs icon/task interaction tests"

  - number: "0x400C4"
    name: Wimp_DeleteIcon
    current_handler: WimpServer::delete_icon
    contract: "R0 window handle; R1 icon index"
    logical_memory: none
    blocking: false
    owner: Wimp
    final_form: "BASIC64 validation over protected icon removal primitive"
    current_tests: "src/wimp.rs icon lifecycle tests"

  - number: "0x400C5"
    name: Wimp_OpenWindow
    current_handler: WimpServer::open_window
    contract: "R1 caller pointer to 32-byte open block; block contains window handle, scroll position, and visible rectangle"
    logical_memory: "checked caller open block"
    blocking: false
    owner: Wimp
    final_form: "BASIC64 open/stack policy over protected window operation primitive"
    current_tests: "tests/wimp_desktop.rs stacking, scroll, resize, and open-request tests"

  - number: "0x400C6"
    name: Wimp_CloseWindow
    current_handler: WimpServer::close_window
    contract: "R1 window handle"
    logical_memory: none
    blocking: false
    owner: Wimp
    final_form: "BASIC64 lifecycle policy over protected window operation primitive"
    current_tests: "src/wimp.rs and tests/wimp_desktop.rs close/focus tests"

  - number: "0x400C7"
    name: Wimp_Poll
    current_handler: WimpServer::poll
    contract: "R0 event mask; R1 caller event-block pointer; returns R0 event reason and writes event block"
    logical_memory: "checked caller poll block (256 bytes)"
    blocking: true
    owner: Wimp
    final_form: "BASIC64 event filtering over task event-queue primitive"
    current_tests: "src/wimp.rs poll-mask tests; tests/wimp_desktop.rs event/task polling tests"

  - number: "0x400C8"
    name: Wimp_RedrawWindow
    current_handler: WimpServer::redraw_window
    contract: "R1 caller redraw block; R0/R1/R2 updated by redraw iteration"
    logical_memory: "checked caller redraw block and returned clip rectangle"
    blocking: false
    owner: Wimp
    final_form: "BASIC64 redraw lifecycle over checked graphics/window primitives"
    current_tests: "src/swi.rs redraw-to-independent-surfaces and clip mapping tests"

  - number: "0x400C9"
    name: Wimp_UpdateWindow
    current_handler: WimpServer::update_window
    contract: "R1 caller update block; R0/R1/R2 updated by update iteration"
    logical_memory: "checked caller update block and returned clip rectangle"
    blocking: false
    owner: Wimp
    final_form: "BASIC64 update lifecycle over checked graphics/window primitives"
    current_tests: "src/wimp.rs update iteration tests"

  - number: "0x400CA"
    name: Wimp_GetRectangle
    current_handler: WimpServer::get_rectangle
    contract: "R1 caller rectangle block; advances active redraw/update loop"
    logical_memory: "checked caller rectangle block"
    blocking: false
    owner: Wimp
    final_form: "BASIC64 redraw/update iteration over checked window primitive"
    current_tests: "src/swi.rs redraw loop/clip tests; src/wimp.rs rectangle iteration tests"

  - number: "0x400CB"
    name: Wimp_GetWindowState
    current_handler: WimpServer::get_window_state
    contract: "R1 caller window-state block containing handle and returned state/bounds"
    logical_memory: "checked caller window-state block"
    blocking: false
    owner: Wimp
    final_form: "BASIC64 state view over protected window query primitive"
    current_tests: "src/wimp.rs window state tests"

  - number: "0x400CD"
    name: Wimp_SetIconState
    current_handler: WimpServer::set_icon_state
    contract: "R0 window handle; R1 icon index; R2 clear flags; R3 set flags"
    logical_memory: none
    blocking: false
    owner: Wimp
    final_form: "BASIC64 icon-state policy over protected icon primitive"
    current_tests: "src/wimp.rs icon-state/event tests"

  - number: "0x400CF"
    name: Wimp_GetPointerInfo
    current_handler: WimpServer::get_pointer_info
    contract: "R1 caller pointer-info block; returns pointer coordinates/window/button state"
    logical_memory: "checked caller 20-byte pointer-info block"
    blocking: false
    owner: Wimp
    final_form: "BASIC64 pointer result adaptation over input-state primitive"
    current_tests: "src/wimp.rs pointer-info tests"

  - number: "0x400D1"
    name: Wimp_ForceRedraw
    current_handler: WimpServer::force_redraw
    contract: "R0 window handle; R1-R4 requested rectangle"
    logical_memory: none
    blocking: false
    owner: Wimp
    final_form: "BASIC64 redraw request policy over protected window primitive"
    current_tests: "src/wimp.rs force-redraw scheduling tests"

  - number: "0x400D4"
    name: Wimp_CreateMenu
    current_handler: WimpServer::create_menu
    contract: "R0 caller menu-tree pointer; R1 anchor x; R2 anchor y"
    logical_memory: "checked caller menu tree and item strings"
    blocking: false
    owner: Wimp
    final_form: "BASIC64 menu validation/interaction over protected menu primitives"
    current_tests: "src/wimp.rs menu-tree and task event tests; tests/wimp_desktop.rs menu pointer tests"

  - number: "0x400D7"
    name: Wimp_SetExtent
    current_handler: WimpServer::set_extent
    contract: "R0 window handle; R1 caller extent block with four signed coordinates"
    logical_memory: "checked caller extent block"
    blocking: false
    owner: Wimp
    final_form: "BASIC64 scroll/extent policy over protected window primitive"
    current_tests: "tests/wimp_desktop.rs extent/scrollbar range tests"

  - number: "0x400DD"
    name: Wimp_CloseDown
    current_handler: WimpServer::close_down
    contract: "R0 task handle; R1 'TASK' magic"
    logical_memory: none
    blocking: false
    owner: Wimp
    final_form: "BASIC64 shutdown policy over task/window lifecycle primitives"
    current_tests: "src/wimp.rs task cleanup tests"

  - number: "0x400DE"
    name: Wimp_StartTask
    current_handler: WimpServer::start_task
    contract: "R0 task launch flags; R1 caller command-line pointer; R2 output task handle"
    logical_memory: "checked caller command line"
    blocking: false
    owner: Wimp
    final_form: "BASIC64 launch policy over protected task creation primitive"
    current_tests: "src/wimp.rs task launch/input/cleanup tests"

  - number: "0x4FF02"
    name: Wimp_CreateIconEx
    current_handler: WimpServer::create_icon_ex
    contract: "hosted extension to Wimp_CreateIcon; icon definition plus optional RGBA asset description"
    logical_memory: "checked caller definition and optional RGBA source buffer"
    blocking: false
    owner: Wimp
    final_form: "BASIC64 extension owned by Wimp; retained as a documented hosted addition"
    current_tests: "src/wimp.rs custom icon asset and ownership tests"

