named_only_services:
  - name: COLOURTRANS_CONVERTHSVTORGB
    current_handler: SwiDispatcher::dispatch_named_swi (inline conversion)
    contract: "R0 16.16 hue; R1/R2 scaled saturation/value; R0-R2 return 8-bit RGB"
    logical_memory: none
    blocking: false
    owner: ColourTrans
    final_form: "BASIC64 colour conversion definition"
    current_tests: "named-only service currently lacks focused direct tests"
  - name: COLOURTRANS_SETGCOL
    current_handler: SwiDispatcher::dispatch_named_swi (GraphicsService mutation)
    contract: "R0 packed RGB colour selects current graphics context colour"
    logical_memory: none
    blocking: false
    owner: ColourTrans
    final_form: "BASIC64 colour state policy over graphics-state primitive"
    current_tests: "graphics snapshots exercise colour use; direct contract test missing"
  - name: COLOURTRANS_WRITEPALETTE
    current_handler: SwiDispatcher::dispatch_named_swi (hosted no-op)
    contract: "currently accepts registers and performs no operation"
    logical_memory: none
    blocking: false
    owner: ColourTrans
    final_form: "BASIC64 service with explicitly documented hosted compatibility behavior"
    current_tests: "no focused test; incomplete hosted implementation"
  - name: ACORN_DESKTOP
    current_handler: SwiDispatcher::acorn_desktop
    contract: "R0 operation selector; R1-R7 operation-specific settings and results"
    logical_memory: "selected operations use checked caller logical pointers"
    blocking: false
    owner: Desktop
    final_form: "BASIC64 desktop configuration/service definition over protected host display operations"
    current_tests: "src/swi.rs desktop API query/update/error tests"
  - name: ACORN_DISPLAY
    current_handler: SwiDispatcher::acorn_display
    contract: "R0 ABI version and query/apply command; R1-R7 return or supply display settings"
    logical_memory: none
    blocking: false
    owner: DisplayManager
    final_form: "BASIC64 display policy over protected host display adapter"
    current_tests: "src/swi.rs acorn_display_swi_queries_applies_and_reports_save_failure_in_registers"

