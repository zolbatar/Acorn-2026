    name: Acorn_DefinitionSource
    current_handler: "ModuleManager.ReadDefinitionSource BASIC64 definition; Host.ModuleManager.ReadDefinitionSource protected primitive"
    contract: "Project extension ABI 1: the original caller Task must carry SourceRead; R0 bytes copied in/out; R1 `Module/Definition` selector input (`FN:` marks functions); R2 source byte offset in/out; R3/R4 chunk buffer/capacity; R5 total source bytes; R6 current generation when unambiguous; R7/R8 source-path buffer/capacity; R9/R10 stable DefinitionId low/high"
    logical_memory: "checked caller selector/path buffers and source chunk; capacities up to 128 bytes for selectors/path and 1025 bytes for source including NUL; chunks copy at most 1024 source bytes, UTF-8 boundaries only. CLI offset is strict decimal 0..2147483647."
    blocking: false
    owner: ModuleManager
    final_form: "BASIC64 read-only query of retained active BASIC64 definition source; no HostFS reopen"
    current_tests: "tests/trellis_mos_introspection.rs::wp51_mos_introspection_matches_read_only_queries_and_tracks_live_generations"
    compatibility: "Hosted extension, not historical. Selects active PROC/FN definitions, including private ones, by stable logical identity; source bytes preserve source line endings and trailing newline. Offset past end or inside a UTF-8 scalar is rejected. Capacity is 2..=1025 while data remains (one byte only at EOF). No historical generations are selectable. The same Task::require_source_read policy applies to direct SWI and *INSPECT DEFINITION/SOURCE calls; denied callers receive TaskAuthorizationDenied before source bytes are read or returned. Public metadata does not imply SourceRead."

caller_authorization:
  owner: Task
  policy: >-
    Public active module/version/state and SWI identity metadata do not require a
    grant. Retained definition source requires SourceRead. OS_Module reason 1
    Load/compatible replacement and reason 4 Delete require the separate
    ModuleManagement right. BASIC64 ModuleManager procedures request the right;
    Rust service handlers recheck it against the same original Task supplied to
    nested SWI/provider calls. Provider module capabilities never upgrade the
    caller. Rights are private task-object state, not keyed by numeric task ID
    or guest-controlled data. `Task::new` grants nothing. Only explicit host
    bootstrap constructors grant a trusted MOS session, source inspector, or
    manager-only task; ordinary spawned desktop tasks do not inherit. Code
    running within a trusted session shares its task principal and rights.
    Grants last for the Task object's lifetime and are revoked by host task
    teardown/replacement; no guest-visible grant/revoke API exists.
  denial: "TaskAuthorizationDenied code 1 = missing SourceRead; code 2 = missing ModuleManagement. Normal and X forms retain the same structured code/message; X sets V and returns a caller-task error block."

