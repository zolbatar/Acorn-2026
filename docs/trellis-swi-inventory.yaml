schema_version: 1
inventory_version: 1
scope:
  source: src/swi.rs, src/wimp.rs, and active modules/*.bas64 manifests
  note: >-
    This describes the hosted dispatcher currently in the repository, including
    named-only project services. It is an implementation inventory, not a
    claim of complete RISC OS coverage. Register and memory descriptions use
    the currently implemented hosted contract; public compatibility gaps are
    recorded in trellis-compatibility-matrix.md.

dispatch_routes:
  module_owned:
    - "0x00 OS_WriteC -> Console.WriteC"
    - "0x01 OS_WriteS -> Console.WriteS"
    - "0x02 OS_Write0 -> Console.Write0"
    - "0x03 OS_NewLine -> Console.NewLine"
    - "0x04 OS_ReadC -> Console.ReadC"
    - "0x0E OS_ReadLine -> Console.ReadLine"
    - "0x38 OS_SWINumberToString -> System.SwiNumberToString"
    - "0x39 OS_SWINumberFromString -> System.SwiNumberFromString"
    - "0x42 OS_ReadMonotonicTime -> System.ReadMonotonicTime"
    - "0x2A OS_ChangeDynamicArea -> Memory.ChangeDynamicArea"
    - "0x2B OS_GenerateError -> Error.GenerateError"
    - "0x66 OS_DynamicArea -> Memory.DynamicArea"
    - "0x4FF10 Acorn_ModuleInfo -> ModuleManager.ReadModuleInfo (project extension)"
    - "0x1E OS_Module -> ModuleManager.OperateModule"
    - "0x4FF12 Acorn_ModuleLookup -> ModuleManager.LookupModule (project extension)"
    - "0x4FF13 Acorn_SwiInfo -> ModuleManager.ReadSwiInfo (project extension)"
    - "0x4FF11 Acorn_TaskInfo -> TaskManager.ReadTaskInfo (project extension)"
    - "0x4FF14 Acorn_ModuleExport -> ModuleManager.LookupModuleExport (project extension)"
    - "0x4FF15 Acorn_DefinitionSource -> ModuleManager.ReadDefinitionSource (project extension)"
    - "0x05 OS_CLI -> TrellisCommands.ExecuteCli"
  transitional_numeric: all numeric services below without a module-owned route
  transitional_named_only:
    - COLOURTRANS_CONVERTHSVTORGB
    - COLOURTRANS_SETGCOL
    - COLOURTRANS_WRITEPALETTE
    - ACORN_DESKTOP
    - ACORN_DISPLAY

system_query_identity:
  authority: "Active module manifest exports; numeric/name constants in host code are routing metadata, not an identity source."
  lookup_scope: "Only currently active manifest-owned exports are mapped. Transitional Rust-only SWIs, the OS_WriteI encoding range, and unknown numbers/names are not synthesized."
  to_string: "OS_SWINumberToString strips bit 17 for the active identity lookup, prepends X when set, returns a NUL-terminated name, and reports the name length excluding NUL in R2. A checked caller buffer must fit name plus NUL."
  from_string: "OS_SWINumberFromString scans a caller-scoped logical string until an ASCII control/space byte, recognizes leading uppercase X as bit 17, matches names exactly/case-sensitively, preserves R1 and returns R0. Unknown names return a structured identity error."
  monotonic_time: "OS_ReadMonotonicTime returns wrapping low-32-bit centiseconds since hosted runtime initialization; unlike the PRM hard-reset/power-on epoch, this hosted epoch is not hardware reset time."
  limits: "The historical PRM also defines fallback names for unmigrated OS SWIs, OS_WriteI character forms, numeric module-chunk suffixes, and User fallback names. Trellis intentionally does not guess identities for services absent from active manifests."
  prm_references:
    - https://www.riscos.com/support/developers/prm/conversions.html
    - https://www.riscos.com/support/developers/prm/timedate.html

numeric_services:
  - number: "0x00"
    name: OS_WriteC
    current_handler: SwiDispatcher::dispatch (transitional fallback); module route takes precedence
    contract: "R0 low byte input; other registers, PC, and carry preserved"
    logical_memory: none
    blocking: false
    owner: Console
    final_form: "BASIC64 definition with ConsoleStream and ConsoleOutput primitive imports"
    current_tests: "WP3 console module end-to-end test; existing Wimp/graphics output tests"

  - number: "0x01"
    name: OS_WriteS
    current_handler: SwiDispatcher::write_inline_string (transitional fallback)
    contract: "PC points at inline NUL-terminated bytes; PC advances to next word-aligned instruction"
    logical_memory: "read from caller task at PC, at most 4096 bytes"
    blocking: false
    owner: Console
    final_form: "BASIC64 definition using typed caller-scoped PC/address traversal and byte output primitives"
    current_tests: "WP3 module test checks PC alignment; 4096-byte missing-terminator test verifies the original PC error address"

  - number: "0x02"
    name: OS_Write0
    current_handler: SwiDispatcher::write_indirect_string (transitional fallback)
    contract: "R0 logical address input; R0 returns first address after NUL"
    logical_memory: "read caller task at R0, at most 4096 bytes"
    blocking: false
    owner: Console
    final_form: "BASIC64 definition using ADDRESS32-typed caller memory and byte output primitives"
    current_tests: "WP3 module test checks returned R0; 4096-byte missing-terminator test verifies the original R0 address"

  - number: "0x03"
    name: OS_NewLine
    current_handler: SwiDispatcher::dispatch (transitional fallback)
    contract: "emits LF then CR through OS_WriteC; registers, PC, and carry preserved"
    logical_memory: none
    blocking: false
    owner: Console
    final_form: "BASIC64 definition composing the Console byte definition"
    current_tests: "WP3 module end-to-end test"

  - number: "0x04"
    name: OS_ReadC
    current_handler: SwiDispatcher::read_character (transitional fallback)
    contract: "R0 receives byte; carry is set for Escape; EndOfInput is a runtime error"
    logical_memory: none
    blocking: true
    owner: Console
    final_form: "BASIC64 definition over ConsoleInput primitive"
    current_tests: "WP3 module test checks byte and Escape carry; tests/mos_calls.rs checks input bridge"

  - number: "0x05"
    name: OS_CLI
    current_handler: "TrellisCommands.ExecuteCli BASIC64 definition; Host.MOS.ExecuteLegacy protected fallback"
    contract: "R0 unmasked caller logical address of command; command runs synchronously and preserves R0 on success. BASIC64 parser recognizes NUL, LF, or CR line endings."
    logical_memory: "checked caller task read at R0, bounded to 256 bytes; unterminated input is rejected, never truncated"
    blocking: true
    owner: TrellisCommands
    final_form: "BASIC64 `*INSPECT`, supported classic module commands, `*CONFIGURE`, and `*STATUS` parsing/selection/validation/presentation plus explicit `Host.MOS.ExecuteLegacy` bridge for remaining MOS commands"
    current_tests: "tests/trellis_classic_module_commands.rs; tests/trellis_mos_introspection.rs; tests/trellis_mos_configuration.rs; tests/trellis_configuration_recovery.rs; tests/trellis_authorization.rs; src/swi.rs CLI abbreviation/configuration/desktop tests; tests/mos_calls.rs"
    configuration_contract: "Current v3 schema has six keys: Language (PRM decimal/&hex/base_num spelling, hosted values 0/3), WimpMode (Mode alias; Auto or canonical X<width> Y<height> C/G<depth>; zero-padded 3/4 digit dimensions canonicalize), BASICMode, BASICProfile, BASICTarget, and BASICEngine. WimpMode alone chooses both resolution and palette: fixed selectors support six logical sizes and C2/C16/C256/C32K/C16M/G4/G16/G256; Auto is host-sized and full-colour C16M/Rgb888. Physical mode IDs, EX/EY scaling and frame rate are unsupported. Defaults: Language=0, BASICMode=AUTO, BASICProfile=AUTO, BASICTarget=AUTO, BASICEngine=INTERPRETER, WimpMode=AUTO. Old DisplayResolution/DisplayColour pairs migrate to WimpMode (Window becomes Auto/full-colour); explicit WimpMode in v2 wins over retired TrellisOutputProfile. WindowFurniture and TrellisOutputProfile rows are discarded on file load; legacy keys are file-load migration only and rejected by command/reset APIs. Renderer appearance is flat-only. Stored reads are bounded to 64 KiB."
    compatibility: "The interim `*TRELLIS` family is not recognized or advertised. `*INSPECT` is read-only: MODULES [filter], MODULE title, SWI name|number, DEFINITION module/definition [strict decimal byte offset], with SOURCE as a read-only alias. Classic supported routes are *Modules, *RMLoad, *RMRun, *RMKill, and conditional *RMEnsure. Final-dot prefixes use a fixed BASIC64 table and exact routes win; ambiguous prefixes error. The current table includes `*I.`, `*M.`, `*Mod.`, and `*INSPE.`; it does not reproduce PRM's dynamic alias/module-order resolution. Repeated leading `*` and command whitespace are stripped. RMLoad/RMRun accept one guest path to BASIC64 filetype &064; init strings are rejected. RMRun equals RMLoad because hosted modules have no app-entry address. RMKill does not model `%instance`. RMEnsure compares numeric major.minor[.patch] components, no-ops when installed version is sufficient, and executes its bounded tail only when missing/older; an unsatisfied check without tail raises CliError. `*Modules` lists logical hosted title/version/state without invented RMA/workspace addresses or instance rows. RMReInit/RMInsert/RMTidy/RMClear/RMFaster/ROMModules/Unplug are explicit unsupported errors without state change because hosted ROM/RMA/unplug support does not exist. CONFIGURE/CONF. and STATUS policy is BASIC64-owned. OS_CLI accepts NUL/LF/CR terminators, preserves R0, and uses checked task-local dynamic scratch released on normal or exceptional exit. Configuration writes require separate caller Task ConfigurationWrite authority deliberately granted to interactive MOS, not inherited by spawned tasks; source reading and module management remain separate rights. Malformed, unsupported, unreadable, invalid-UTF-8, and oversized stored configuration now boots with safe defaults and a path-redacted warning/status; the file remains unchanged until an authorized successful repair preserves recoverable bytes in a `.recovery-*` sibling and atomically writes canonical v3. Oversized input is copied by streaming. This post-foundation route is separate from native capsule recovery. Remaining MOS command semantics are transitional Rust; full OS_CLI migration is open."

  - number: "0x06"
    name: OS_Byte
    current_handler: SwiDispatcher::os_byte via MosState
    contract: "R0 low byte reason; R1/R2 inputs and reason-specific return registers/carry"
    logical_memory: none
    blocking: false
    owner: MOS
    final_form: "BASIC64 MOS policy over typed input, configuration, and clock primitives"
    current_tests: "tests/mos_calls.rs: osbyte_keyboard_queue_and_cli_use_existing_services; input/register preservation tests"

  - number: "0x07"
    name: OS_Word
    current_handler: SwiDispatcher::os_word and MosState
    contract: "R0 reason; R1 caller logical pointer to reason-specific control block"
    logical_memory: "checked caller memory; reason-specific size (clock reasons 1-4 are tested)"
    blocking: false
    owner: MOS
    final_form: "BASIC64 reason dispatch over typed caller-memory and clock primitives"
    current_tests: "tests/mos_calls.rs: call_osword_uses_checked_full_and_split_pointers"

  - number: "0x08"
    name: OS_File
    current_handler: SwiDispatcher::os_file
    contract: "R0 action; R1 filename pointer; R2-R5 action-specific input/output registers"
    logical_memory: "checked caller strings and action-specific control data"
    blocking: false
    owner: FileSwitch
    final_form: "BASIC64 FileSwitch semantics over filesystem and caller-memory primitives"
    current_tests: "src/swi.rs FileSwitch/guest catalogue tests; compatibility gaps are listed in the matrix"

  - number: "0x09"
