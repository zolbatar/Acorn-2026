schema_version: 1
inventory_version: 1
scope:
  source: src/swi.rs, src/wimp.rs, and active modules/*.bas64 manifests
  note: >-
    This describes the hosted dispatcher currently in the repository, including
    named-only project services. It is an implementation inventory, not a
    claim of complete RISC OS coverage. Register and memory descriptions use
    the currently implemented hosted contract; public compatibility gaps are
    recorded in ricochet-compatibility-matrix.md.

dispatch_routes:
  module_owned:
    - "0x08 OS_File -> FileSwitch.FileService (hosted reasons 0-12, 16-18, 255; path deviations documented)"
    - "0x09 OS_Args -> FileSwitch.ArgsService (supported reasons 0-5 and 7)"
    - "0x0A OS_BGet -> FileSwitch.ByteGetService"
    - "0x0B OS_BPut -> FileSwitch.BytePutService"
    - "0x0C OS_GBPB -> FileSwitch.BulkTransferService (reasons 1-10)"
    - "0x0D OS_Find -> FileSwitch.FindService"
    - "0x00 OS_WriteC -> Console.WriteC"
    - "0x01 OS_WriteS -> Console.WriteS"
    - "0x02 OS_Write0 -> Console.Write0"
    - "0x03 OS_NewLine -> Console.NewLine"
    - "0x04 OS_ReadC -> Console.ReadC"
    - "0x0E OS_ReadLine -> Console.ReadLine"
    - "0x38 OS_SWINumberToString -> System.SwiNumberToString"
    - "0x39 OS_SWINumberFromString -> System.SwiNumberFromString"
    - "0x42 OS_ReadMonotonicTime -> System.ReadMonotonicTime"
    - "0x23 OS_ReadVarVal -> System.ReadVarVal"
    - "0x24 OS_SetVarVal -> System.SetVarVal"
    - "0x2A OS_ChangeDynamicArea -> Memory.ChangeDynamicArea"
    - "0x2B OS_GenerateError -> Error.GenerateError"
    - "0x66 OS_DynamicArea -> Memory.DynamicArea"
    - "0x4FF10 Ricochet_ModuleInfo -> ModuleManager.ReadModuleInfo (project extension)"
    - "0x1E OS_Module -> ModuleManager.OperateModule"
    - "0x4FF12 Ricochet_ModuleLookup -> ModuleManager.LookupModule (project extension)"
    - "0x4FF13 Ricochet_SwiInfo -> ModuleManager.ReadSwiInfo (project extension)"
    - "0x4FF11 Ricochet_TaskInfo -> TaskManager.ReadTaskInfo (project extension)"
    - "0x4FF14 Ricochet_ModuleExport -> ModuleManager.LookupModuleExport (project extension)"
    - "0x4FF15 Ricochet_DefinitionSource -> ModuleManager.ReadDefinitionSource (project extension)"
    - "0x05 OS_CLI -> RicochetCommands.ExecuteCli"
    - "0x06 OS_Byte -> Mos.ByteService"
    - "0x07 OS_Word -> Mos.WordService"
    - "0x32 OS_ReadPoint -> Graphics.ReadPointService"
    - "0x45 OS_Plot -> Graphics.PlotService"
  transitional_numeric: all numeric services below without a module-owned route
  transitional_named_only:
    - COLOURTRANS_CONVERTHSVTORGB
    - COLOURTRANS_SETGCOL
    - COLOURTRANS_WRITEPALETTE
    - RICOCHET_DESKTOP
    - RICOCHET_DISPLAY

system_query_identity:
  authority: "Active module manifest exports; numeric/name constants in host code are routing metadata, not an identity source."
  lookup_scope: "Only currently active manifest-owned exports are mapped. Transitional Rust-only SWIs, the OS_WriteI encoding range, and unknown numbers/names are not synthesized."
  to_string: "OS_SWINumberToString strips bit 17 for the active identity lookup, prepends X when set, returns a NUL-terminated name, and reports the name length excluding NUL in R2. A checked caller buffer must fit name plus NUL."
  from_string: "OS_SWINumberFromString scans a caller-scoped logical string until an ASCII control/space byte, recognizes leading uppercase X as bit 17, matches names exactly/case-sensitively, preserves R1 and returns R0. Unknown names return a structured identity error."
  monotonic_time: "OS_ReadMonotonicTime returns wrapping low-32-bit centiseconds since hosted runtime initialization; unlike the PRM hard-reset/power-on epoch, this hosted epoch is not hardware reset time."
  limits: "The historical PRM also defines fallback names for unmigrated OS SWIs, OS_WriteI character forms, numeric module-chunk suffixes, and User fallback names. Ricochet intentionally does not guess identities for services absent from active manifests."
  prm_references:
    - https://www.riscos.com/support/developers/prm/conversions.html
    - https://www.riscos.com/support/developers/prm/timedate.html

numeric_services:
  - number: "0x00"
    name: OS_WriteC
    current_handler: SwiDispatcher::dispatch (transitional fallback); module route takes precedence
    contract: "R0 low byte input; other registers, PC, and carry preserved"
    logical_memory: none
    blocking: false
    owner: Console
    final_form: "BASIC64 definition with ConsoleStream and ConsoleOutput primitive imports"
    current_tests: "WP3 console module end-to-end test; existing Wimp/graphics output tests"

  - number: "0x01"
    name: OS_WriteS
    current_handler: SwiDispatcher::write_inline_string (transitional fallback)
    contract: "PC points at inline NUL-terminated bytes; PC advances to next word-aligned instruction"
    logical_memory: "read from caller task at PC, at most 4096 bytes"
    blocking: false
    owner: Console
    final_form: "BASIC64 definition using typed caller-scoped PC/address traversal and byte output primitives"
    current_tests: "WP3 module test checks PC alignment; 4096-byte missing-terminator test verifies the original PC error address"

  - number: "0x02"
    name: OS_Write0
    current_handler: SwiDispatcher::write_indirect_string (transitional fallback)
    contract: "R0 logical address input; R0 returns first address after NUL"
    logical_memory: "read caller task at R0, at most 4096 bytes"
    blocking: false
    owner: Console
    final_form: "BASIC64 definition using ADDRESS32-typed caller memory and byte output primitives"
    current_tests: "WP3 module test checks returned R0; 4096-byte missing-terminator test verifies the original R0 address"

  - number: "0x03"
    name: OS_NewLine
    current_handler: SwiDispatcher::dispatch (transitional fallback)
    contract: "emits LF then CR through OS_WriteC; registers, PC, and carry preserved"
    logical_memory: none
    blocking: false
    owner: Console
    final_form: "BASIC64 definition composing the Console byte definition"
    current_tests: "WP3 module end-to-end test"

  - number: "0x04"
    name: OS_ReadC
    current_handler: SwiDispatcher::read_character (transitional fallback)
    contract: "R0 receives byte; carry is set for Escape; EndOfInput is a runtime error"
    logical_memory: none
    blocking: true
    owner: Console
    final_form: "BASIC64 definition over ConsoleInput primitive"
    current_tests: "WP3 module test checks byte and Escape carry; tests/mos_calls.rs checks input bridge"

  - number: "0x05"
    name: OS_CLI
    current_handler: "RicochetCommands.ExecuteCli BASIC64 definition; active @COMMAND registry with explicit closed-allowlist Rust bridges"
    contract: "R0 unmasked caller logical address of command; command runs synchronously and preserves R0 on success. BASIC64 parser recognizes NUL, LF, or CR line endings."
    logical_memory: "checked caller task read at R0, bounded to 256 bytes; unterminated input is rejected, never truncated"
    blocking: true
    owner: RicochetCommands
    final_form: "BASIC64 `@COMMAND` registry owns OS_CLI recognition, abbreviation order, and BASIC64 command policy; *HELP reads the same active registry. Transitional Rust behavior is reachable only through explicit closed-allowlist BRIDGE descriptors; there is no catch-all ExecuteLegacy route."
    current_tests: "tests/ricochet_classic_module_commands.rs; tests/ricochet_mos_introspection.rs; tests/ricochet_mos_configuration.rs; tests/ricochet_configuration_recovery.rs; tests/ricochet_authorization.rs; src/swi.rs CLI abbreviation/configuration/desktop tests; tests/mos_calls.rs"
    command_script_subset: "BASIC64 *OBEY uses the active @COMMAND registry and same caller Task. Rust supplies bounded checked guest reads/source frames; BASIC64 classifies, substitutes parameters once, and dispatches lines. Supports LF/CRLF/CR, blank lines, leading-space | comments, EOF without final newline, stop-on-first-error with guest path/line provenance, prior-effect retention, and QUIT unwinding. Limits: 65,536 bytes across active scripts, 255 command bytes per line, 4,096 physical lines per session, eight nested sources. %0-%9, %*n and %% use space-separated arguments outside quotes; quotes are retained, missing args are empty, malformed quote/%* forms and expanded overlength lines reject before that line dispatches. Task-local read-only Obey$Dir exposes the resolved guest parent via OS_ReadVarVal/type-0 expansion and restores by frame pop; it intentionally differs from PRM's invocation-text parent fragment. PRM -v/-c, Exec, aliases, general command expansion, automatic !Boot/filetype execution, and arbitrary RISC OS script compatibility are not claimed."
    configuration_contract: "Current v3 schema has six keys: Language (PRM decimal/&hex/base_num spelling, hosted values 0/3), WimpMode (Mode alias; Auto or canonical X<width> Y<height> C/G<depth>; zero-padded 3/4 digit dimensions canonicalize), BASICMode, BASICProfile, BASICTarget, and BASICEngine. WimpMode alone chooses both resolution and palette: fixed selectors support six logical sizes and C2/C16/C256/C32K/C16M/G4/G16/G256; Auto is host-sized and full-colour C16M/Rgb888. Physical mode IDs, EX/EY scaling and frame rate are unsupported. Defaults: Language=0, BASICMode=AUTO, BASICProfile=AUTO, BASICTarget=AUTO, BASICEngine=INTERPRETER, WimpMode=AUTO. Old DisplayResolution/DisplayColour pairs migrate to WimpMode (Window becomes Auto/full-colour); explicit WimpMode in v2 wins over retired RicochetOutputProfile. WindowFurniture and RicochetOutputProfile rows are discarded on file load; legacy keys are file-load migration only and rejected by command/reset APIs. Renderer appearance is flat-only. Stored reads are bounded to 64 KiB."
    compatibility: "The interim `*RICOCHET` family is not recognized or advertised. `*INSPECT` is read-only: MODULES [filter], MODULE title, SWI name|number, DEFINITION module/definition [strict decimal byte offset], with SOURCE as a read-only alias. Classic supported routes are *Modules, *RMLoad, *RMRun, *RMKill, and conditional *RMEnsure. Final-dot prefixes use a fixed BASIC64 table and exact routes win; ambiguous prefixes error. The current table includes `*I.`, `*M.`, `*Mod.`, and `*INSPE.`; it does not reproduce PRM's dynamic alias/module-order resolution. Repeated leading `*` and command whitespace are stripped. RMLoad/RMRun accept one guest path to BASIC64 filetype &064; init strings are rejected. RMRun equals RMLoad because hosted modules have no app-entry address. RMKill does not model `%instance`. RMEnsure compares numeric major.minor[.patch] components, no-ops when installed version is sufficient, and executes its bounded tail only when missing/older; an unsatisfied check without tail raises CliError. `*Modules` lists logical hosted title/version/state without invented RMA/workspace addresses or instance rows. RMReInit/RMInsert/RMTidy/RMClear/RMFaster/ROMModules/Unplug are explicit unsupported errors without state change because hosted ROM/RMA/unplug support does not exist. CONFIGURE/CONF., STATUS, INSPECT, classic module commands, and HELP policy are BASIC64-owned and use the active @COMMAND registry. Rust-backed transitional command behavior is exposed only through explicit closed-allowlist BRIDGE descriptors; unknown commands return BASIC64 Bad command and never fall through to a generic host parser or execute arbitrary files. OS_CLI accepts NUL/LF/CR terminators, preserves R0, and uses checked task-local dynamic scratch released on normal or exceptional exit. Configuration writes require separate caller Task ConfigurationWrite authority deliberately granted to interactive MOS, not inherited by spawned tasks; source reading and module management remain separate rights. Malformed, unsupported, unreadable, invalid-UTF-8, and oversized stored configuration now boots with safe defaults and a path-redacted warning/status; the file remains unchanged until an authorized successful repair preserves recoverable bytes in a `.recovery-*` sibling and atomically writes canonical v3. Oversized input is copied by streaming. This post-foundation route is separate from native capsule recovery. Rust remains behind the documented command bridges; OS_CLI recognition has no catch-all Rust fallback."

  - number: "0x06"
    name: OS_Byte
    current_handler: "Mos.ByteService BASIC64 definition; Host.MosInput.* mechanisms"
    contract: "R0 low byte reason; R1/R2 inputs and reason-specific return registers/carry"
    logical_memory: none
    blocking: true
    owner: Mos
    final_form: "Mos.ByteService owns reasons 21 (x=0), 129 (y<128), and 138 (x=0); checked typed input/timing primitives. No Rust numeric fallback."
    current_tests: "tests/ricochet_mos_swi_ownership.rs; tests/mos_calls.rs; tests/ricochet_exec.rs"

  - number: "0x07"
    name: OS_Word
    current_handler: "Mos.WordService BASIC64 definition; Host.Clock.* and checked five-byte memory mechanisms"
    contract: "R0 reason; R1 caller logical pointer to reason-specific control block"
    logical_memory: "checked caller memory; reason-specific size (clock reasons 1-4 are tested)"
    blocking: false
    owner: Mos
    final_form: "Mos.WordService owns reasons 1-4 with checked five-byte little-endian clock blocks; no Rust numeric fallback."
    current_tests: "tests/ricochet_mos_swi_ownership.rs; tests/mos_calls.rs"

  - number: "0x08"
    name: OS_File
    current_handler: FileSwitch.FileService
    contract: "R0 action; R1 filename pointer; R2-R5 action-specific input/output registers"
    logical_memory: "checked caller strings and action-specific control data"
    blocking: false
    owner: FileSwitch
    final_form: "BASIC64 FileSwitch semantics over filesystem and caller-memory primitives"
    current_tests: "tests/ricochet_os_file_ownership.rs; tests/ricochet_os_file_paths.rs; bounded File$Path/R4 paths, limits, and remaining deviations are listed in the matrix"

  - number: "0x09"
    name: OS_Args
    current_handler: FileSwitch.ArgsService
    contract: "R0 reason; R1 handle; reasons 0-5 use R2 for position/extent/EOF; reason 7 uses R2 guest name buffer and R5 capacity/spare-byte result; reasons 0-5 and 7 supported"
    logical_memory: "reason 7 conditionally writes canonical guest name plus NUL through a full-span checked caller buffer; no unconditional R2 pointer contract"
    blocking: false
    owner: FileSwitch
    final_form: "BASIC64 FileSwitch operation over task-owned file-channel primitives"
    current_tests: "tests/ricochet_fileswitch_channel_ownership.rs; PRM Args 4 reports extent because HostFS has no allocation-size model"

  - number: "0x0A"
    name: OS_BGet
    current_handler: FileSwitch.ByteGetService
    contract: "R1 file handle input and preserved; R0 byte when carry clear; first EOF sets carry, subsequent read errors"
    logical_memory: none
    blocking: false
    owner: FileSwitch
    final_form: "BASIC64 byte-read service over a checked task file-channel primitive"
    current_tests: "tests/ricochet_fileswitch_channel_ownership.rs; includes EOF, handle, caller isolation and CALL bridge cases"

  - number: "0x0B"
    name: OS_BPut
    current_handler: FileSwitch.BytePutService
    contract: "R0 byte and R1 file handle input; supported register values preserved"
    logical_memory: none
    blocking: false
    owner: FileSwitch
    final_form: "BASIC64 byte-write service over a checked task file-channel primitive"
    current_tests: "tests/ricochet_fileswitch_channel_ownership.rs; includes checked host channel and CALL bridge cases"

  - number: "0x0C"
    name: OS_GBPB
    current_handler: FileSwitch.BulkTransferService
    contract: "BASIC64-owned reasons 1-4 file transfer, 5-7 fixed names, 8-10 bounded directory output; R0 reason, operation-specific R1-R6, public register/carry results follow PRM subset"
    logical_memory: "transfer buffer preflighted as a complete caller-data span (max 1 MiB); fixed-name and directory output preflighted before bytes are written; excludes reserved X-error block"
    blocking: false
    owner: FileSwitch
    final_form: "BASIC64 reason/register/record policy over task-owned transfer and bounded catalogue snapshot primitives; no numeric Rust fallback"
    current_tests: "tests/ricochet_gbpb_ownership.rs; reasons 1-10, caller span/cursor atomicity, continuation and record alignment; reasons 11-12 remain unsupported"

  - number: "0x0D"
    name: OS_Find
    current_handler: FileSwitch.FindService
    contract: "R0 action; R1 direct guest pathname on supported open reasons or handle/0 for close; R0 returns channel handle, or 0 for missing file without missing-is-error bit"
    logical_memory: "conditional checked caller NUL string on open; R1 is otherwise scalar to preserve the reason-dependent handle/path register shape"
    blocking: false
    owner: FileSwitch
    final_form: "BASIC64 channel lifecycle over filesystem primitives"
    current_tests: "tests/ricochet_fileswitch_channel_ownership.rs; direct path/modes, missing file, close-all, task isolation and CALL bridge"

  - number: "0x0E"
    name: OS_ReadLine
    current_handler: "Console.ReadLine via module entry cell; SwiDispatcher::read_line remains an explicit transitional fallback"
    contract: "R0 buffer/options; R1 maximum length; R2/R3 accepted byte range; R4 optional echo byte; returns R0=0, R1=length, R2=R3=0 and carry on Escape"
    logical_memory: "checked caller buffer, at most requested length"
    blocking: true
    owner: Console
    final_form: "BASIC64 edit/echo policy over ConsoleInput, ConsoleOutput, and checked caller-scoped memory"
    current_tests: "swi::tests::os_read_line_* cover module route, editing/backspace, accepted range, echo-only and R4 substitution flags, buffer-full bell, Escape, EOF, CR and memory bounds; exhaustive option combinations and exact error-block details remain gaps"

  - number: "0x1E"
    name: OS_Module
    current_handler: "ModuleManager.OperateModule BASIC64 definition; Host.ModuleManager.LoadSource/Unload protected primitives"
    contract: "Historical reason 1 Load (R0=1,R1 pathname) and reason 4 Delete (R0=4,R1 full module title); both require ModuleManagement on the original caller Task; R0/R1 preserved on success. Load reads a HostFS guest path to UTF-8 BASIC64 source filetype &064 and links/starts a new module, or performs a compatible-immediate same-title source replacement. Delete quiesces/finalises an active guest module."
    logical_memory: "R1 is a checked caller-scoped NUL-terminated logical string (256 bytes for Load, 128 for Delete)"
    blocking: true
    owner: ModuleManager
    final_form: "BASIC64 reason selection and public policy over protected HostFS/registry/lifecycle mechanisms"
    current_tests: "swi::tests::module_manager_loads_inspects_and_unloads_guest_source_modules; swi::tests::module_manager_replaces_guest_exports_as_one_generation_and_preserves_workspace; wp51_os_module_replacement_is_atomic_compatible_and_preserves_active_calls; swi::tests::module_manager_rolls_back_failed_guest_start_and_protects_foundation; swi::tests::module_manager_enforces_guest_capability_and_dependency_boundaries; swi::tests::swi_errors_and_x_form_errors_use_the_documented_task_scoped_block"
    compatibility: "Deliberate hosted adaptation: &064 visible BASIC64 source replaces historical &FFA relocatable ARM image. The requestor Task must carry ModuleManagement; ModuleManager's provider capability does not confer it. Titles are ASCII alphanumeric and matched case-insensitively; case-only replacement preserves the installed spelling. A same-title Load atomically replaces all exports only when module identity/version/dependencies/capabilities/lifecycle, SWI names/numbers/definition names/register contracts, exported PROC/FN signatures, and full persistent/type schema are unchanged. It preserves ModuleId, entry-cell IDs and workspace; active leases keep old code. Candidate Start and old Quiesce/Finalise are not rerun. Incompatible candidates are rejected without disturbing the installed module. This is intentionally safer than PRM reason 1, which kills the old module and all instantiations before initialization. No init parameters or %instantiations. Only reasons 1 and 4 are supported. Reasons 0, 2-3, 5-17, and 19-20 return UnsupportedServiceReason. Reasons 12 and 18 are specifically rejected because their outputs include raw module/private-word/postfix pointers; safe inventory and name lookup are provided by Ricochet_ModuleInfo and Ricochet_ModuleLookup."

  - number: "0x23"
    name: OS_ReadVarVal
    current_handler: "System.ReadVarVal BASIC64 definition; Host.SystemVariables.Read protected primitive"
    contract: "R0 selector C-string pointer; R1 output-buffer pointer; R2 capacity or high-bit length probe; R3=0 begins a wildcard read and nonzero is an opaque caller-task name/context pointer; R4=3 requests conversion, other values request raw string bytes. R0/R1 are preserved; R2 returns byte length/probe result, R3 returns the next matching name pointer for wildcard enumeration, R4 returns actual stored type. Probe on a missing exact name returns R2=0; for R4 other than 3, an existing value of length N returns bitwise-NOT N. Wildcard exhaustion is code 2, including X-form V/error-block reporting."
    logical_memory: "Checked caller logical memory: NUL-terminated selector up to 33 bytes (hosted subset; PRM permits any ASCII <=32 terminator), plus the requested output capacity up to 256 bytes. Values are length-delimited and not NUL-terminated. Wildcard names are returned through task-owned, task-local dynamic areas; context identity is not a host pointer and cannot be reused by another task."
    blocking: false
    owner: System
    final_form: "BASIC64 `OS_ReadVarVal` policy over one runtime-scoped bounded guest-variable store"
    current_tests: "tests/ricochet_command_variables.rs; tests/ricochet_variable_expansion.rs; system_variables unit tests"
    compatibility: "Only string type 0 and literal string type 4 are stored. Type-0 writes immediately expand exact <name> references, outer/doubled quotes, and printable |<, |>, ||, |\" escapes with no rescanning; type-4 and reads preserve raw stored bytes. Numeric, control, wildcard-reference and other GSTrans syntax is rejected. Names use visible ASCII, case-insensitive lookup, preserved creation spelling, and bounded `*`/`#` wildcards. At most 128 entries and 32 KiB aggregate name/value bytes are retained. The store is runtime-session local, not persisted and never sourced from the host environment."

  - number: "0x24"
    name: OS_SetVarVal
    current_handler: "System.SetVarVal BASIC64 definition; Host.SystemVariables.Write protected primitive"
    contract: "R0 selector/name C-string pointer; R1 value pointer; R2 signed byte length (negative means delete); R3 context must be zero; R4 type 0 or 4. Successful calls preserve R0-R2, set R3=0, and return the stored type in R4. Type 0 requires an LF, CR, or NUL at R1+R2; type 4 is exactly R2 bytes."
    logical_memory: "Checked caller logical memory: NUL-terminated selector up to 33 bytes (hosted subset; PRM permits any ASCII <=32 terminator); values up to 256 UTF-8 bytes; type-0 terminator checked at R1+R2. Type-4 payload has no terminator requirement."
    blocking: false
    owner: System
    final_form: "BASIC64 type/register policy over a protected shared-store mechanism"
    current_tests: "tests/ricochet_command_variables.rs; tests/ricochet_variable_expansion.rs; system_variables unit tests"
    compatibility: "Mutation checks the original caller Task for separate SystemVariableWrite authority before reading caller buffers; the trusted MOS session is explicitly granted that right, ordinary tasks and tasks with only source/module/configuration rights are not. Exact names create/update; wildcard updates require exactly one existing match, while negative-length deletion removes every match. Only STRING and LiteralString are accepted; type 0 uses a bounded immediate string-expansion subset, with no public OS_GSTrans ABI. Macro, numeric, code, evaluation and general GSTrans forms are unsupported."

  - number: "0x29"
    name: OS_FSControl
    current_handler: FileSwitch.FileSystemControl
    contract: "R0 reason; R1 filesystem number or string pointer; R2-R5 reason-specific data"
    logical_memory: "checked caller strings and reason-specific control data"
    blocking: false
    owner: FileSwitch
    final_form: "BASIC64 filing-system policy over host volume and checked memory primitives"
    current_tests: "tests/ricochet_fscontrol_ownership.rs; bounded hosted reason coverage"

  - number: "0x32"
    name: OS_ReadPoint
    current_handler: Graphics.ReadPointService
    contract: "R0/R1 input coordinates; R2/R3 result colour/tint; R4 indicates outside-surface result"
    logical_memory: none
    blocking: false
    owner: Graphics
    final_form: "BASIC64 profile/result policy over a caller-task/window CPU-raster query primitive"
    current_tests: "tests/ricochet_graphics_swi_ownership.rs; swi::tests::os_read_point_reads_immediate_pixels_and_preserves_coordinates"
    compatibility: "R0/R1 are preserved. Classic queries return R2 colour, R3 tint and R4=0; an outside-surface query returns R2=R4=&FFFFFFFF and R3=0. Modern text mode returns the existing profile-specific error because its overlay is not in the guest raster. Indexed colours remain estimates from the RGBA raster."

  - number: "0x38"
    name: OS_SWINumberToString
    current_handler: "System.SwiNumberToString BASIC64 definition; Host.System.SwiNumberToString protected primitive"
    contract: "R0 SWI number and R1 buffer pointer are preserved; R2 is the maximum buffer length on entry and name length on exit. Output is NUL-terminated; bit 17 adds a leading X."
    logical_memory: "R1 is a checked caller-scoped logical output buffer; capacity is 1..128 bytes and must fit the returned name plus NUL."
    blocking: false
    owner: System
    final_form: "BASIC64 conversion policy over active manifest identity lookup and checked caller memory"
    current_tests: "swi::tests::system_query_swis_use_active_manifest_identity_and_checked_buffers; wp51_public_contracts_cover_modules_errors_identity_and_system_queries"
    compatibility: "Only active manifest-owned SWIs are returned. Transitional Rust-only handlers, OS_WriteI aliases, numeric module-chunk names, and unknown User names are not synthesized; unsupported identity and short-buffer cases return structured errors."

  - number: "0x39"
    name: OS_SWINumberFromString
    current_handler: "System.SwiNumberFromString BASIC64 definition; Host.System.SwiNumberFromString protected primitive"
    contract: "R1 points to a control/space-terminated name; R1 is preserved and R0 receives the SWI number. Leading uppercase X sets bit 17. Names are case-sensitive."
    logical_memory: "R1 is a checked caller-scoped logical input string, scanned to ASCII control/space within 128 bytes."
    blocking: false
    owner: System
    final_form: "BASIC64 name/X policy over active manifest identity lookup and checked caller memory"
    current_tests: "swi::tests::system_query_swis_use_active_manifest_identity_and_checked_buffers; wp51_public_contracts_cover_modules_errors_identity_and_system_queries"
    compatibility: "Only active manifest-owned names resolve. Historical module numeric suffix forms and OS_WriteI aliases are not parsed; non-ASCII/unterminated/unknown names return structured errors."

  - number: "0x42"
    name: OS_ReadMonotonicTime
    current_handler: "System.ReadMonotonicTime BASIC64 definition; Host.System.ReadMonotonicTime protected primitive"
    contract: "No inputs; R0 returns wrapping 32-bit centiseconds from the hosted monotonic epoch."
    logical_memory: none
    blocking: false
    owner: System
    final_form: "BASIC64 public dispatch over an independent hosted monotonic clock mechanism"
    current_tests: "swi::tests::system_query_swis_use_active_manifest_identity_and_checked_buffers; wp51_public_contracts_cover_modules_errors_identity_and_system_queries"
    compatibility: "The epoch begins at hosted runtime initialization rather than the hardware's last hard reset or power-on."

  - number: "0x45"
    name: OS_Plot
    current_handler: Graphics.PlotService
    contract: "R0 plot code; R1/R2 signed logical coordinates"
    logical_memory: none
    blocking: false
    owner: Graphics
    final_form: "BASIC64 plot-code policy over a caller-task/window CPU-raster submission primitive"
    current_tests: "tests/ricochet_graphics_swi_ownership.rs; Wimp redraw/graphics routing tests"
    compatibility: "The hosted service masks R0 to the low plot-code byte, interprets R1/R2 as signed 32-bit coordinate bit patterns, and preserves R0-R2 deterministically (the PRM marks them corrupted/unspecified). The existing GraphicsState plot subset is unchanged; complete VDU/plot-code conformance is not claimed."

